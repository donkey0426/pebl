name: Build and Deploy cIGT to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  EMSDK_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            bison \
            flex \
            wget \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-net-dev \
            libsdl2-mixer-dev \
            libsdl2-gfx-dev \
            libcurl4-openssl-dev

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: libs/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p libs
          git clone https://github.com/emscripten-core/emsdk.git libs/emsdk
          cd libs/emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          cd libs/emsdk
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Cache SDL2_gfx emscripten build
        id: cache-sdl2gfx
        uses: actions/cache@v4
        with:
          path: libs/SDL2_gfx-1.0.4/build-em
          key: sdl2gfx-em-${{ runner.os }}-${{ env.EMSDK_VERSION }}-v4

      - name: Build SDL2_gfx for Emscripten
        if: steps.cache-sdl2gfx.outputs.cache-hit != 'true'
        run: |
          source libs/emsdk/emsdk_env.sh
          cd libs/SDL2_gfx-1.0.4
          mkdir -p build-em
          emcc -O2 -sUSE_SDL=2 -c SDL2_gfxPrimitives.c -o build-em/SDL2_gfxPrimitives.o

      - name: Build PEBL for Emscripten
        run: |
          source libs/emsdk/emsdk_env.sh
          make em-opt -j "$(nproc)" EXPORTED_RUNTIME_METHODS='["ccall","cwrap","FS","callMain","requestFullscreen"]' 
          ASYNCIFY_STACK_SIZE=1048576

      - name: Patch shell HTML for cIGT
        run: |
          cp bin/pebl2.html bin/cigt.html
          cp bin/pebl2.js bin/cigt.js
          cp bin/pebl2.wasm bin/cigt.wasm
          if [ -f bin/pebl2.data ]; then cp bin/pebl2.data bin/cigt.data; fi
          sed -i 's/createPEBLModule/createPEBLModule/g' bin/cigt.html
          cat emscripten/shell_cigt.html > /tmp/shell_cigt_patch.html

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp bin/pebl2.js site/pebl2.js
          cp bin/pebl2.wasm site/pebl2.wasm
          if [ -f bin/pebl2.data ]; then cp bin/pebl2.data site/pebl2.data; fi
          cat > site/index.html << 'HTMLEOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>cIGT Task</title>
            <style>
              body { margin: 0; background: #000; }
              canvas { display: block; margin: 0 auto; background: #000; }
              #status { color: white; text-align: center; font-family: sans-serif; padding: 10px; }
            </style>
          </head>
          <body>
            <div id="status">Loading...</div>
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            <script src="pebl2.js"></script>
            <script>
              var Module = {
                noInitialRun: true,
                canvas: document.getElementById('canvas'),
                print: function(t) { console.log(t); },
                printErr: function(t) { console.error(t); },
                setStatus: function(t) { document.getElementById('status').innerHTML = t; }
              };
              createPEBLModule(Module).then(function(instance) {
                document.getElementById('status').style.display = 'none';
                var participant = new URLSearchParams(window.location.search).get('participant') || 'P' + Math.floor(Math.random()*900000+100000);
                instance.callMain(['/usr/local/share/pebl2/battery/cigt/cigt.pbl', '-s', participant]);
              });
            </script>
          </body>
          </html>
          HTMLEOF
          ls -la site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
