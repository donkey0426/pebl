name: Build and Deploy cIGT to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  EMSDK_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake bison flex wget \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsdl2-net-dev libsdl2-mixer-dev libsdl2-gfx-dev \
            libcurl4-openssl-dev

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: libs/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p libs
          git clone https://github.com/emscripten-core/emsdk.git libs/emsdk
          cd libs/emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten SDK
        run: |
          cd libs/emsdk
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Cache SDL2_gfx emscripten build
        id: cache-sdl2gfx
        uses: actions/cache@v4
        with:
          path: libs/SDL2_gfx-1.0.4/build-em
          key: sdl2gfx-em-${{ runner.os }}-${{ env.EMSDK_VERSION }}-v8

      - name: Build SDL2_gfx for Emscripten
        if: steps.cache-sdl2gfx.outputs.cache-hit != 'true'
        run: |
          source libs/emsdk/emsdk_env.sh
          cd libs/SDL2_gfx-1.0.4
          mkdir -p build-em
          emcc -O2 -sUSE_SDL=2 -c SDL2_gfxPrimitives.c -o build-em/SDL2_gfxPrimitives.o

      - name: Compile all source files with emcc
        run: |
          source libs/emsdk/emsdk_env.sh
          mkdir -p obj-em/src/base obj-em/src/apps obj-em/src/objects \
                   obj-em/src/libs obj-em/src/devices obj-em/src/platforms/sdl \
                   obj-em/src/utility bin

          FLAGS="-O2 -DPEBL_EMSCRIPTEN -DPEBL_HTTP -DHTTP_LIB=3 -DPEBL_MIXER \
            -DPREFIX=/usr/local/ -DEXECNAME=pebl2 -DPEBLNAME=pebl2 \
            -DPEBLDIRNAME=pebl2 -DPEBL_VERSION=\"2.4\" \
            -DPEBL_ITERATIVE_EVAL -UPEBL_USE_LSL \
            -sUSE_SDL=2 -sUSE_SDL_NET=2 -sUSE_SDL_TTF=2 \
            -sUSE_SDL_IMAGE=2 -sUSE_SDL_MIXER=2 \
            -Ilibs/SDL2_gfx-1.0.4 -Ilibs/utfcpp/source"

          compile_cpp() { em++ $FLAGS -c "$1" -o "$2"; }

          compile_cpp src/base/Evaluator-es.cpp obj-em/src/base/Evaluator-es.o
          compile_cpp src/base/FunctionMap.cpp obj-em/src/base/FunctionMap.o
          compile_cpp src/base/grammar.tab.cpp obj-em/src/base/grammar.tab.o
          compile_cpp src/base/PEBLObject.cpp obj-em/src/base/PEBLObject.o
          compile_cpp src/base/Loader.cpp obj-em/src/base/Loader.o
          compile_cpp src/base/PComplexData.cpp obj-em/src/base/PComplexData.o
          compile_cpp src/base/PList.cpp obj-em/src/base/PList.o
          compile_cpp src/base/PNode.cpp obj-em/src/base/PNode.o
          compile_cpp src/base/VariableMap.cpp obj-em/src/base/VariableMap.o
          compile_cpp src/base/Variant.cpp obj-em/src/base/Variant.o
          em++ $FLAGS -Wno-register -c src/base/lex.yy.c -o obj-em/src/base/lex.yy.o
          compile_cpp src/apps/PEBL.cpp obj-em/src/apps/PEBL.o
          compile_cpp src/devices/PEventLoop-es.cpp obj-em/src/devices/PEventLoop-es.o
          compile_cpp src/devices/PDevice.cpp obj-em/src/devices/PDevice.o
          compile_cpp src/devices/PEventQueue.cpp obj-em/src/devices/PEventQueue.o
          compile_cpp src/devices/PEvent.cpp obj-em/src/devices/PEvent.o
          compile_cpp src/devices/PKeyboard.cpp obj-em/src/devices/PKeyboard.o
          compile_cpp src/devices/PTimer.cpp obj-em/src/devices/PTimer.o
          compile_cpp src/devices/DeviceState.cpp obj-em/src/devices/DeviceState.o
          compile_cpp src/devices/PStream.cpp obj-em/src/devices/PStream.o
          compile_cpp src/devices/PAudioOut.cpp obj-em/src/devices/PAudioOut.o
          compile_cpp src/devices/PNetwork.cpp obj-em/src/devices/PNetwork.o
          compile_cpp src/devices/PJoystick.cpp obj-em/src/devices/PJoystick.o
          compile_cpp src/libs/PEBLMath.cpp obj-em/src/libs/PEBLMath.o
          compile_cpp src/libs/PEBLStream.cpp obj-em/src/libs/PEBLStream.o
          compile_cpp src/libs/PEBLObjects.cpp obj-em/src/libs/PEBLObjects.o
          compile_cpp src/libs/PEBLEnvironment.cpp obj-em/src/libs/PEBLEnvironment.o
          compile_cpp src/libs/PEBLList.cpp obj-em/src/libs/PEBLList.o
          compile_cpp src/libs/PEBLString.cpp obj-em/src/libs/PEBLString.o
          compile_cpp src/libs/PEBLLSL.cpp obj-em/src/libs/PEBLLSL.o
          compile_cpp src/objects/PEnvironment.cpp obj-em/src/objects/PEnvironment.o
          compile_cpp src/objects/PWidget.cpp obj-em/src/objects/PWidget.o
          compile_cpp src/objects/PWindow.cpp obj-em/src/objects/PWindow.o
          compile_cpp src/objects/PImageBox.cpp obj-em/src/objects/PImageBox.o
          compile_cpp src/objects/PCanvas.cpp obj-em/src/objects/PCanvas.o
          compile_cpp src/objects/PColor.cpp obj-em/src/objects/PColor.o
          compile_cpp src/objects/PDrawObject.cpp obj-em/src/objects/PDrawObject.o
          compile_cpp src/objects/PFont.cpp obj-em/src/objects/PFont.o
          compile_cpp src/objects/PTextObject.cpp obj-em/src/objects/PTextObject.o
          compile_cpp src/objects/PLabel.cpp obj-em/src/objects/PLabel.o
          compile_cpp src/objects/PTextBox.cpp obj-em/src/objects/PTextBox.o
          compile_cpp src/objects/PMovie.cpp obj-em/src/objects/PMovie.o
          compile_cpp src/objects/PCustomObject.cpp obj-em/src/objects/PCustomObject.o
          compile_cpp src/utility/PEBLUtility.cpp obj-em/src/utility/PEBLUtility.o
          compile_cpp src/utility/PError.cpp obj-em/src/utility/PError.o
          compile_cpp src/utility/BinReloc.cpp obj-em/src/utility/BinReloc.o
          compile_cpp src/utility/PEBLPath.cpp obj-em/src/utility/PEBLPath.o
          compile_cpp src/utility/PEBLHTTP.cpp obj-em/src/utility/PEBLHTTP.o
          compile_cpp src/utility/md5.cpp obj-em/src/utility/md5.o
          compile_cpp src/utility/FontCache.cpp obj-em/src/utility/FontCache.o
          compile_cpp src/utility/FormatParser.cpp obj-em/src/utility/FormatParser.o
          compile_cpp src/utility/PLabStreamingLayer.cpp obj-em/src/utility/PLabStreamingLayer.o
          compile_cpp src/platforms/sdl/PlatformEnvironment.cpp obj-em/src/platforms/sdl/PlatformEnvironment.o
          compile_cpp src/platforms/sdl/PlatformWidget.cpp obj-em/src/platforms/sdl/PlatformWidget.o
          compile_cpp src/platforms/sdl/PlatformWindow.cpp obj-em/src/platforms/sdl/PlatformWindow.o
          compile_cpp src/platforms/sdl/PlatformImageBox.cpp obj-em/src/platforms/sdl/PlatformImageBox.o
          compile_cpp src/platforms/sdl/PlatformKeyboard.cpp obj-em/src/platforms/sdl/PlatformKeyboard.o
          compile_cpp src/platforms/sdl/PlatformFont.cpp obj-em/src/platforms/sdl/PlatformFont.o
          compile_cpp src/platforms/sdl/PlatformLabel.cpp obj-em/src/platforms/sdl/PlatformLabel.o
          compile_cpp src/platforms/sdl/PlatformTextBox.cpp obj-em/src/platforms/sdl/PlatformTextBox.o
          compile_cpp src/platforms/sdl/PlatformTimer.cpp obj-em/src/platforms/sdl/PlatformTimer.o
          compile_cpp src/platforms/sdl/PlatformDrawObject.cpp obj-em/src/platforms/sdl/PlatformDrawObject.o
          compile_cpp src/platforms/sdl/PlatformCanvas.cpp obj-em/src/platforms/sdl/PlatformCanvas.o
          compile_cpp src/platforms/sdl/SDLUtility.cpp obj-em/src/platforms/sdl/SDLUtility.o
          compile_cpp src/platforms/sdl/PlatformEventQueue.cpp obj-em/src/platforms/sdl/PlatformEventQueue.o
          compile_cpp src/platforms/sdl/PlatformAudioOut.cpp obj-em/src/platforms/sdl/PlatformAudioOut.o
          compile_cpp src/platforms/sdl/PlatformNetwork.cpp obj-em/src/platforms/sdl/PlatformNetwork.o
          compile_cpp src/platforms/sdl/PlatformJoystick.cpp obj-em/src/platforms/sdl/PlatformJoystick.o
          compile_cpp src/platforms/sdl/PlatformAudioIn.cpp obj-em/src/platforms/sdl/PlatformAudioIn.o
          emcc $FLAGS -std=gnu99 -c src/utility/re.c -o obj-em/src/utility/re.o
          echo "All source files compiled successfully"

      - name: Link final WASM binary
        run: bash scripts/link-cigt.sh

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp bin/pebl2.js site/pebl2.js
          cp bin/pebl2.wasm site/pebl2.wasm
          if [ -f bin/pebl2.data ]; then cp bin/pebl2.data site/pebl2.data; fi
          cp questionnaire.html site/questionnaire.html
          python3 scripts/make-index.py
          ls -la site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
